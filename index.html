<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ОГЭ • Математический практикум</title><style>
:root{color-scheme:light;--bg:#f7f5ef;--ink:#293b35;--muted:#64766d;--card:#fffefa;--line:#dce3d8;--accent:#416c58}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}body.dark{color-scheme:dark;--bg:#17231f;--ink:#e4eee6;--muted:#a9beb0;--card:#22322a;--line:#40564a;--accent:#a4d9b6}header{position:sticky;top:0;z-index:3;background:var(--card);border-bottom:1px solid var(--line);padding:14px max(20px,calc((100vw - 1160px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}button,input,a{font:inherit}button,.link{cursor:pointer;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:9px 15px;text-decoration:none}button[aria-pressed=true],.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}main{max-width:1200px;margin:auto;padding:24px 20px 60px}.hero{padding:32px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(120deg,var(--card),var(--bg));margin-bottom:24px}h1{font-size:clamp(30px,5vw,52px);line-height:1.1;margin:8px 0 14px}h2{font-size:23px}p{margin:8px 0;color:var(--muted)}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:20px 0}input{min-width:180px;flex:1;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px;min-height:185px}.card h3{margin:0;font-size:19px}.num{font-weight:800;color:var(--accent);font-size:28px}.card p{font-size:14px}.card button{margin-top:auto;text-align:left}.card button:hover,button:hover{outline:2px solid var(--accent);outline-offset:2px}.status{font-size:12px;color:var(--muted)}.section{margin-top:30px}.empty{padding:25px;border:1px dashed var(--line);border-radius:16px}.items{display:grid;gap:10px}.item{padding:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.item div{flex:1;min-width:180px}.item h3{margin:0}.hidden{display:none!important}footer{text-align:center;color:var(--muted);font-size:13px;padding:20px}dialog{width:min(1000px,96vw);height:90dvh;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:0}dialog::backdrop{background:#0008}.viewer{height:100%;display:flex;flex-direction:column}.bar{display:flex;align-items:center;gap:8px;padding:10px;flex-wrap:wrap}.bar strong{flex:1}iframe{width:100%;flex:1;border:0;background:white} @media(max-width:550px){.hero{padding:20px}.tools button{font-size:13px}header strong{font-size:14px}}
</style></head><body><header><strong>∑ &nbsp; ОГЭ · Математический практикум</strong><button id="theme" aria-label="Переключить тему">☾</button></header><main><section class="hero"><small>9 КЛАСС · МАТЕМАТИКА</small><h1>Практикум ОГЭ</h1><p>Выбери номер задания, изучи теорию, потренируйся и проверь себя.</p><p id="stats"></p></section><section id="catalog"><div class="tools"><input id="search" type="search" placeholder="Поиск по номеру или теме…" aria-label="Поиск"><button data-filter="all" aria-pressed="true">Все</button><button data-filter="ready" aria-pressed="false">Готовые</button><button data-filter="part1" aria-pressed="false">Часть 1</button><button data-filter="part2" aria-pressed="false">Часть 2</button></div><div id="groups"></div></section><section id="detail" class="hidden"><button id="back">← Все задания</button><h2 id="detailTitle"></h2><div class="tools" id="types"></div><div id="materials" class="items"></div></section></main><footer>Математический практикум · Библиотека интерактивных материалов</footer><dialog id="dialog"><div class="viewer"><div class="bar"><strong id="lessonTitle"></strong><a class="link" id="external" target="_blank" rel="noopener">В новой вкладке ↗</a><button id="full">⛶</button><button id="close">Закрыть</button></div><iframe id="frame" title="Учебный материал" allowfullscreen></iframe></div></dialog><script src="catalog.js?v=3"></script><script>
const $=id=>document.getElementById(id), topics=window.OGE_TOPICS||[], entries=window.OGE_MATERIALS||[];let filter='all',active=null,type='all';const kinds={all:'Все материалы',lesson:'Уроки',theory:'Теория',trainer:'Тренажёры',practice:'Практика',game:'Игры',test:'Проверочные'};const el=(tag,txt,cls)=>{const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e};function count(id){return entries.filter(e=>e.topic===id).length}function render(){const q=$('search').value.trim().toLowerCase().replace(/^№\s*/,'');$('groups').replaceChildren();for(const [part,title] of [[1,'Часть 1 · задания с кратким ответом'],[2,'Часть 2 · развёрнутые решения']]){const list=topics.filter(t=>t.part===part&&(!q||(''+t.id+' '+t.title).toLowerCase().includes(q)||entries.some(e=>e.topic===t.id&&e.title.toLowerCase().includes(q)))&&(filter!=='ready'||count(t.id))&&(filter!=='part1'||part===1)&&(filter!=='part2'||part===2));if(!list.length)continue;const sec=el('section',undefined,'section'),grid=el('div',undefined,'grid');sec.append(el('h2',title),grid);for(const t of list){const c=el('article',undefined,'card'),b=el('button',count(t.id)?'Открыть материалы →':'Открыть раздел →');b.onclick=()=>location.hash='topic='+t.id;c.append(el('div','№ '+t.id,'num'),el('h3',t.title),el('div',count(t.id)?'Материалов: '+count(t.id):'Пока нет материалов','status'),b);grid.append(c)}$('groups').append(sec)}if(!$('groups').children.length)$('groups').append(el('p','Ничего не найдено.','empty'));$('stats').textContent=topics.length+' разделов · '+entries.length+' материалов'}
function detail(){const id=decodeURIComponent(location.hash.slice(7)),t=topics.find(x=>x.id===id);active=t||null;$('catalog').classList.toggle('hidden',!!t);$('detail').classList.toggle('hidden',!t);if(!t){render();return}type='all';$('detailTitle').textContent='№ '+t.id+' · '+t.title;showMaterials();window.scrollTo(0,0)}
function showMaterials(){$('types').replaceChildren();for(const [k,v] of Object.entries(kinds)){const b=el('button',v);b.setAttribute('aria-pressed',k===type);b.onclick=()=>{type=k;showMaterials()};$('types').append(b)}$('materials').replaceChildren();const list=entries.filter(e=>e.topic===active.id&&(type==='all'||e.type===type));if(!list.length)$('materials').append(el('p','Здесь появятся учебные материалы.','empty'));for(const e of list){const item=el('article',undefined,'item'),d=el('div'),b=el('button','Открыть');d.append(el('h3',e.title),el('p',(kinds[e.type]||'Материал')+' · '+(e.description||'')));b.onclick=()=>{const u=new URL(e.path,location.href);if(u.origin!==location.origin&&location.protocol!=='file:')return;location.href=u.href};item.append(d,b);$('materials').append(item)}}
$('search').oninput=render;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});$('back').onclick=()=>location.hash='';window.addEventListener('hashchange',detail);$('close').onclick=()=>$('dialog').close();$('dialog').addEventListener('close',()=>{$('frame').src='about:blank';if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})});$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else $('dialog').requestFullscreen?.().catch(()=>{})};$('theme').onclick=()=>{document.body.classList.toggle('dark');try{localStorage.setItem('oge-theme',document.body.classList.contains('dark')?'dark':'light')}catch{}};try{document.body.classList.toggle('dark',localStorage.getItem('oge-theme')==='dark')}catch{}detail();
</script></body></html>
