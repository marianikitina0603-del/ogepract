function mountInteractive(n){
 const root=$('interactive'); if(!root)return;

 if(n===0){root.innerHTML='<h3>Исследуй таблицу</h3><p>Выбери диаметр диска. Затем отметь разрешённые размеры в таблице слева.</p><div id="columns"></div><output id="info">Выбери столбец.</output>';const cells=[...$('condition').querySelectorAll('td')];let col=0;[12,13,14].forEach((v,j)=>{const b=document.createElement('button');b.textContent=v+'″';b.onclick=()=>{col=j+1;root.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));cells.forEach((x,k)=>{x.classList.remove('chosen');x.style.opacity=k%4===col||k%4===0?'1':'.35'});$('info').textContent='Выбран диск '+v+'″. Отметь подходящие маркировки.'};$('columns').append(b)});cells.forEach((c,k)=>{if(k%4){c.tabIndex=0;c.onclick=()=>{if(k%4===col&&c.textContent.trim()!=='—')c.classList.toggle('chosen')};c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();c.click()}}}});return}
