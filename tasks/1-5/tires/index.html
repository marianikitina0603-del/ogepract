];const titles=['Начало','Теория',...qs.map(q=>q.title),'Итоги'];let state={i:0,answers:{},correct:{},attempts:{},revealed:{},ink:{},notebook:{},heights:{}};try{state={...state,...JSON.parse(localStorage.getItem('oge-tires-v1')||'{}')}}catch{}let i=Math.max(0,Math.min(7,state.i||0)),step=0,drawing=false,mode='pen',bookMode='pen';const redoStacks={};function save(){state.i=i;try{localStorage.setItem('oge-tires-v1',JSON.stringify(state))}catch(e){console.warn(e)}}function math(node){if(window.renderMathInElement)renderMathInElement(node,{delimiters:[{left:'$',right:'$',display:false}]})}function esc(s){const e=document.createElement('span');e.textContent=s;return e.innerHTML}function question(){return qs[i-2]}function render(){step=0;const q=question();$('position').textContent=(i+1)+' / '+titles.length;$('progress').style.width=((i+1)/titles.length*100)+'%';$('prev').disabled=i===0;$('next').disabled=i===7;if(i===0)$('content').innerHTML='<small>ОГЭ №1–5 · Практические задачи</small><h1>Шины<br>Математика в движении</h1><p>Пять заданий из открытого банка. Изучите маркировку, рассчитайте размеры колеса и сравните пробег.</p><button onclick="go(1)">Начать урок →</button><p class="muted">Источник: сборник А. Д. Остромогильского, обновление 28.08.2026, стр. 9–11, задачи 1.3–5.3.</p>';else if(i===1)$('content').innerHTML='<h2>Маркировка и формулы</h2>'+theory;else if(q)$('content').innerHTML='<small>Задание '+(i-1)+'.3 · ФИПИ</small><h2>'+q.title+'</h2><div id="condition">'+q.q+(q.extra||'')+'</div><p class="muted">Заводская маркировка: 175/70 R12</p><div class="row"><input id="answer" inputmode="decimal" placeholder="Ответ" value="'+esc(state.answers[i]||'')+'"><button id="check">Проверить</button><button id="keyToggle">⌨</button></div><div class="kbd row" id="keys" hidden></div><p id="feedback" class="feedback"></p><div class="row"><button id="hint">Подсказка</button><button id="solution">Следующий шаг решения</button><button data-open="book">Черновик</button></div><p i
