];const titles=['Начало','Теория',...qs.map(q=>q.title),'Итоги'];let state={i:0,answers:{},correct:{},attempts:{},revealed:{},ink:{},notebook:{},heights:{}};try{state={...state,...JSON.parse(localStorage.getItem('oge-tires-v1')||'{}')}}catch{}let i=Math.max(0,Math.min(7,state.i||0)),step=0,drawing=false,mode='pen',bookMode='pen';const redoStacks={};function save(){state.i=i;try{localStorage.setItem('oge-tires-v1',JSON.stringify(state))}catch(e){console.warn(e)}}function math(node){if(window.renderMathInElement)renderMathInElement(node,{delimiters:[{left:'$',right:'$',display:false}]})}function esc(s){const e=document.createElement('span');e.textContent=s;return e.innerHTML}function question(){return qs[i-2]}function render(){step=0;const q=question();$('position').textContent=(i+1)+' / '+titles.length;$('progress').style.width=((i+1)/titles.length*100)+'%';$('prev').disabled=i===0;$('next').disabled=i===7;if(i===0)$('content').innerHTML='<small>ОГЭ №1–5 · Практические задачи</small><h1>Шины<br>Математика в движении</h1><p>Пять заданий из открытого банка. Изучите маркировку, рассчитайте размеры колеса и сравните пробег.</p><button onclick="go(1)">Начать урок →</button><p class="muted">Источник: сборник А. Д. Остромогильского, обновление 28.08.2026, стр. 9–11, задачи 1.3–5.3.</p>';else if(i===1)$('content').innerHTML='<h2>Маркировка и формулы</h2>'+theory;else if(q)$('content').innerHTML='<small>Задание '+(i-1)+'.3 · ФИПИ</small><h2>'+q.title+'</h2><div class="task-layout"><div id="condition">'+q.q+(q.extra||'')+'</div><section class="interactive" id="interactive"></section></div><p class="muted">Заводская маркировка: 175/70 R12</p><div class="row"><input id="answer" inputmode="decimal" placeholder="Ответ" value="'+esc(state.answers[i]||'')+'"><button id="check">Проверить</button><button id="keyToggle">⌨</button></div><div class="kbd row" id="keys" hidden></div><p id="feedback" class="feedback"></p><div class="row"><button id="hint">Подсказка</button><button id="solut  const root=$('interactive'); if(!root)return;
 const f=x=>x.toLocaleString('ru-RU',{maximumFractionDigits:3});
 const D=(b,p,d)=>25.4*d+2*b*p/100;
 const wheel=(b,p,d,x,y,scale,color='#40534a')=>{const R=D(b,p,d)*scale/2,r=d*25.4*scale/2;return '<circle cx="'+x+'" cy="'+y+'" r="'+R+'" fill="'+color+'"/><circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="#c9d6cc"/><circle cx="'+x+'" cy="'+y+'" r="3" fill="#40534a"/><path d="M'+x+' '+(y-R)+' V'+(y+R)+'" stroke="#e4a545" stroke-width="2"/>'};
 if(n===0){root.innerHTML='<h3>Исследуй таблицу</h3><p>Выбери диаметр диска. Затем отметь разрешённые размеры в таблице слева.</p><div id="columns"></div><output id="info">Выбери столбец.</output>';const cells=[...$('condition').querySelectorAll('td')];let col=0;[12,13,14].forEach((v,j)=>{const b=document.createElement('button');b.textContent=v+'″';b.onclick=()=>{col=j+1;root.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));cells.forEach((x,k)=>{x.classList.remove('chosen');x.style.opacity=k%4===col||k%4===0?'1':'.35'});$('info').textContent='Выбран диск '+v+'″. Отметь подходящие маркировки.'};$('columns').append(b)});cells.forEach((c,k)=>{if(k%4){c.tabIndex=0;c.onclick=()=>{if(k%4===col&&c.textContent.trim()!=='—')c.classList.toggle('chosen')};c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();c.click()}}}});return}
 if(n===1){root.innerHTML='<h3>Высота боковины</h3><p>Измени ширину и профиль. Цветная часть показывает высоту боковины относительно ширины.</p><label>Ширина: <b id="bv"></b><input id="ib" type="range" min="125" max="275" step="5" value="165"></label><label>Профиль: <b id="pv"></b><input id="ip" type="range" min="30" max="85" step="5" value="65"></label><svg id="visual" viewBox="0 0 340 160"></svg><button id="measure">Показать расчёт</button><output id="info"></output>';let show=false;function update(){let b=+$('ib').value,p=+$('ip').value; $('bv').textContent=b+' мм';$('pv').textContent=p+'%';$('visual').innerHTML='<rect x="45" y="20" width="250" height="42" rx="8" fill="#40534a"/><rect x="45" y="20" width="'+(250*p/100)+'" height="42" rx="8" fill="#e4a545"/><text x="45" y="90" font-size="15">B = '+b+' мм</text><text x="45" y="118" font-size="15">H = '+p+'% от B</text>';$('info').textContent=show?'H = '+b+' × '+p+'/100 = '+f(b*p/100)+' мм':''}['ib','ip'].forEach(k=>$(k).oninput=update);$('measure').onclick=()=>{show=!show;update()};update();return}
 if(n===2){root.innerHTML='<h3>Собери диаметр</h3><p>Включи части диаметра колеса на схеме.</p><svg id="visual" viewBox="0 0 340 290"></svg><div id="parts"></div><output id="info"></output>';const selected=new Set();['Верхняя боковина','Диск','Нижняя боковина'].forEach((v,j)=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>{selected.has(j)?selected.delete(j):selected.add(j);b.classList.toggle('on',selected.has(j));update()};$('parts').append(b)});function update(){let a=[18,74,216,272];$('visual').innerHTML=wheel(175,70,12,170,145,254/549.8)+a.slice(0,3).map((y,j)=>'<path d="M170 '+y+' V'+a[j+1]+'" stroke="'+(selected.has(j)?'#e4a545':'#f4f4ed')+'" stroke-width="7"/>').join('');$('info').textContent=selected.size===3?'Собраны все части: H + d + H. Теперь вычисли диаметр.':'Выбрано частей: '+selected.size+' из 3'}update();return}
 if(n===3){root.innerHTML='<h3>Сравни два радиуса</h3><p>Оба диска имеют одинаковый размер. Переключи вид, чтобы увидеть разницу боковин.</p><button id="toggle">Наложить контуры</button><svg id="visual" viewBox="0 0 360 205"></svg><button id="measure">Показать разницу</button><output id="info"></output>';let over=false;function update(){const sc=.29;$('visual').innerHTML=over?wheel(175,65,13,180,98,sc)+'<circle cx="180" cy="98" r="'+D(185,60,13)*sc/2+'" fill="none" stroke="#df8d31" stroke-width="2" stroke-dasharray="4 3"/>':wheel(185,60,13,90,90,sc)+wheel(175,65,13,270,90,sc)+'<text x="90" y="194" text-anchor="middle">185/60 R13</text><text x="270" y="194" text-anchor="middle">175/65 R13</text>'}$('toggle').onclick=()=>{over=!over;$('toggle').textContent=over?'Разместить рядом':'Наложить контуры';update()};$('measure').onclick=()=>{$('info').textContent='Разница высот боковин: 113,75 − 111 = 2,75 мм'};update();return}
 root.innerHTML='<h3>Один оборот — какой путь?</h3><p>Запусти оба колеса. Они совершат по одному обороту с одинаковой угловой скоростью.</p><svg id="visual" viewBox="0 0 390 190"></svg><button id="roll">Один оборот</button><button id="resetRoll">Сбросить</button><button id="measure">Показать длины окружностей</button><output id="info"></output>';let token=0;function draw(t){const d1=549.8,d2=557.7;const sc=.053,base=38;const row=(d,y,c)=>{const rad=d*sc/2,x=base+Math.PI*d*sc*t;return '<path d="M'+base+' '+(y+rad)+' H350" stroke="#a9bdad"/><path d="M'+base+' '+(y+rad)+' H'+x+'" stroke="'+c+'" stroke-width="4"/><circle cx="'+x+'" cy="'+y+'" r="'+rad+'" fill="'+c+'"/><path d="M'+x+' '+y+' l'+(rad*Math.sin(t*2*Math.PI))+' '+(-rad*Math.cos(t*2*Math.PI))+'" stroke="white" stroke-width="2"/>'};$('visual').innerHTML='<text x="18" y="15">175/70 R12</text>'+row(d1,45,'#40534a')+'<text x="18" y="105">175/65 R13</text>'+row(d2,135,'#bd8541')+'<text x="18" y="183">Оборот: '+Math.round(t*100)+'%</text>'}$('roll').onclick=()=>{const k=++token,start=performance.now();function tick(now){if(k!==token||!root.isConnected)return;const t=Math.min(1,(now-start)/1800);draw(t);if(t<1)requestAnimationFrame(tick)}requestAnimationFrame(tick)};$('resetRoll').onclick=()=>{token++;draw(0);$('info').textContent=''};$('measure').onclick=()=>{$('info').textContent='L₁ ≈ '+f(Math.PI*549.8)+' мм; L₂ ≈ '+f(Math.PI*557.7)+' мм. Сравни относительно L₁.'};draw(0)

function check(){const q=question(),v=$('answer').value.trim().replace(',','.').replace('−','-');state.attempts[i]=(state.attempts[i]||0)+1;const ok=v!==''&&Number.isFinite(Number(v))&&Math.abs(Number(v)-q.a)<1e-8;state.correct[i]=ok;$('feedback').textContent=ok?'Верно!':'Пока неверно. Проверь вычисления.';$('feedback').className=ok?'good':'bad';save()}
function go(n){i=Math.max(0,Math.min(7,n));render();window.scrollTo(0,0)}$('prev').onclick=()=>go(i-1);$('next').onclick=()=>go(i+1);$('nav').onclick=()=>openPanel('menu');titles.forEach((t,j)=>{const b=document.createElement('button');b.textContent=(j+1)+'. '+t;b.onclick=()=>{go(j);$('menu').hidden=true};$('menuItems').append(b)});$('theorybody').innerHTML=theory;
function openPanel(id){const p=$(id);p.hidden=false;p.classList.remove('min');requestAnimationFrame(resizeAll)}document.querySelectorAll('.panel').forEach(p=>{p.querySelector('[data-close]').onclick=()=>p.hidden=true;const mn=p.querySelector('[data-min]'),mx=p.querySelector('[data-max]');if(mn)mn.onclick=()=>p.classList.toggle('min');if(mx)mx.onclick=()=>{p.classList.toggle('max');requestAnimationFrame(resizeAll)};const bar=p.querySelector('.panelbar');bar.onpointerdown=e=>{if(e.target.closest('button')||p.classList.contains('max'))return;const r=p.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;bar.setPointerCapture(e.pointerId);bar.onpointermove=ev=>{p.style.left=Math.max(0,Math.min(innerWidth-80,ev.clientX-x))+'px';p.style.top=Math.max(0,Math.min(innerHeight-50,ev.clientY-y))+'px';p.style.right='auto'};bar.onpointerup=()=>bar.onpointermove=null}});
function strokes(kind){return (state[kind][i]||=[]) }function redraw(c,kind){const ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);for(const s of strokes(kind)){ctx.globalCompositeOperation=s.mode==='erase'?'destination-out':'source-over';ctx.globalAlpha=s.mode==='marker'?.25:1;ctx.strokeStyle=s.color;ctx.lineWidth=s.width*devicePixelRatio;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();s.points.forEach((p,j)=>j?ctx.lineTo(p[0]*w,p[1]*h):ctx.moveTo(p[0]*w,p[1]*h));ctx.stroke()}ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over'}
function fit(c,kind){if(!c.clientWidth||!c.clientHeight)return;c.width=Math.round(c.clientWidth*devicePixelRatio);c.height=Math.round(c.clientHeight*devicePixelRatio);redraw(c,kind)}function resizeAll(){$('bookCanvas').style.height=(state.heights[i]||420)+'px';fit($('overlay'),'ink');fit($('bookCanvas'),'notebook')}new ResizeObserver(resizeAll).observe($('slide'));window.addEventListener('resize',resizeAll);
function attach(c,kind,getMode){let s=null,owner=null;const point=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};c.onpointerdown=e=>{if(getMode()==='scroll'||e.pointerType==='touch'&&owner!==null)return;e.preventDefault();owner=e.pointerId;c.setPointerCapture(owner);const m=getMode(),p=point(e);s={mode:m,color:$('color').value,width:m==='erase'?24:m==='marker'?18:Number($('width').value),points:[p,[p[0]+.0001,p[1]+.0001]]};strokes(kind).push(s);redoStacks[kind+i]=[];redraw(c,kind)};c.onpointermove=e=>{if(!s||e.pointerId!==owner)return;s.points.push(point(e));redraw(c,kind)};c.onpointerup=c.onpointercancel=()=>{s=null;owner=null;save()}}
attach($('overlay'),'ink',()=>mode);attach($('bookCanvas'),'notebook',()=>bookMode);$('draw').onclick=()=>{drawing=!drawing;$('overlay').classList.toggle('on',drawing);$('draw').classList.toggle('on',drawing);$('inkbar').hidden=!drawing;$('inkbar').style.display=drawing?'flex':'none'};for(const m of ['pen','marker','erase'])$(m).onclick=()=>mode=m;function undo(kind){const s=strokes(kind).pop();if(s)(redoStacks[kind+i]||=[]).push(s);save();resizeAll()}function redo(kind){const s=redoStacks[kind+i]?.pop();if(s)strokes(kind).push(s);save();resizeAll()}function clear(kind){if(confirm('Очистить записи текущего слайда?')){state[kind][i]=[];redoStacks[kind+i]=[];save();resizeAll()}}$('undo').onclick=()=>undo('ink');$('redo').onclick=()=>redo('ink');$('clear').onclick=()=>clear('ink');$('bookPen').onclick=()=>{bookMode='pen';$('bookCanvas').style.touchAction='none'};$('bookErase').onclick=()=>{bookMode='erase';$('bookCanvas').style.touchAction='none'};$('bookScroll').onclick=()=>{bookMode='scroll';$('bookCanvas').style.touchAction='pan-y'};$('bookUndo').onclick=()=>undo('notebook');$('bookRedo').onclick=()=>redo('notebook');$('bookClear').onclick=()=>clear('notebook');$('addSpace').onclick=()=>{const old=state.heights[i]||420,newH=old+240;for(const s of strokes('notebook'))for(const p of s.points)p[1]*=old/newH;state.heights[i]=newH;save();resizeAll()};
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function png(id){if(!window.html2canvas){alert('Библиотека экспорта не загрузилась. Используйте печать.');return}try{const c=await html2canvas($(id),{scale:2,backgroundColor:'#fff'});c.toBlob(b=>{if(b)dl(b,'shiny-'+id+'-'+(i+1)+'.png')})}catch{alert('Не удалось сохранить изображение')}}$('snap').onclick=()=>png('slide');$('bookSave').onclick=()=>png('paper');function downloadReport(){dl(new Blob([JSON.stringify({source:'ФИПИ, сборник MathStart, стр. 9–11',...state},null,2)],{type:'application/json'}),'shiny-report.json')}$('report').onclick=downloadReport;$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,button'))return;if(e.key==='ArrowRight')go(i+1);if(e.key==='ArrowLeft')go(i-1)});render();window.addEventListener('load',()=>math(document.body));
